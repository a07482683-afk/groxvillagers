name: Build Minecraft Mod

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    # Укажите имя вашей папки, если файлы лежат внутри неё (например, ./real-villagers-template)
    # Если файлы прямо в корне, эта строка не нужна
    defaults:
      run:
        working-directory: ./имя_вашей_папки

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew build

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mod-jar-file
        path: "**/build/libs/*.jar"
